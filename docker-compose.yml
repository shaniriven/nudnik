services:
  postgres-dev:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nudnik
      POSTGRES_PASSWORD: nudnik
      POSTGRES_DB: nudnik_dev
    ports:
      - '5432:5432'
    volumes:
      - nudnik_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nudnik -d nudnik_dev']
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nudnik
      POSTGRES_PASSWORD: nudnik
      POSTGRES_DB: nudnik_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nudnik -d nudnik_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  nudnik_pgdata_dev:
